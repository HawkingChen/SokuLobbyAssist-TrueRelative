; 修改后完整重启游戏。坐标基于 640x480 大厅画面，单位为像素。
[Overlay]
; above=头上，center=身上居中，right=头像右侧。
position=above
offset_x=0
offset_y=0

[OwnRating]
; F9 打开设置菜单；F10 切换等级分自动显示／关闭。
; 这里设置自己的固定评分卡左上角坐标。
; 默认自动按游戏档案名查询网站认领账号；若需覆盖，在 account= 后填网站账号名或 handle。
account=
x=12
y=12

; 大厅内按 F9 打开设置菜单，下列值在菜单关闭时保存。
[Display]
; auto=自动显示最近玩家，manual=F8 手动选人，off=不显示其他玩家的评分。
mode=auto
own_rating=1
relative_level=0

; 全体玩家标记默认关闭。分差以自己的评分为基准。
[Markers]
enabled=0
lower_gap=100
higher_gap=300
